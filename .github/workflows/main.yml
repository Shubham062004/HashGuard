name: HashGuard CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm install

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm install

      - name: Build Frontend
        working-directory: ./frontend
        run: npm run build

      - name: Backend Lint Check (Optional)
        working-directory: ./backend
        run: |
          # If there was a lint script
          # npm run lint
          echo "No lint script found, skipping."

      - name: Docker Build Simulation
        run: |
          docker build -t hashguard-backend ./backend
          docker build -t hashguard-frontend ./frontend
