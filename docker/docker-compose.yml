version: '3.8'

services:
  backend:
    build: ../backend
    ports:
      - "5050:5050"
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ../backend/uploads:/app/uploads

  frontend:
    build: ../frontend
    ports:
      - "80:80"
    depends_on:
      - backend
